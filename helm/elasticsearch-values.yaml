# Elasticsearch — Helm values
# Install: helm repo add elastic https://helm.elastic.co
# Install: helm upgrade --install elasticsearch elastic/elasticsearch -n logging --create-namespace -f elasticsearch-values.yaml

replicas: 1
minimumMasterNodes: 1

imageTag: "8.5.1"

resources:
  requests:
    cpu: "100m"
    memory: "768Mi"
  limits:
    cpu: "500m"
    memory: "1536Mi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

esJavaOpts: "-Xmx768m -Xms768m"

networkPolicy:
  enabled: false

# Single-node: disable security for simplicity (no TLS cert nightmares)
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
    discovery.type: single-node

# Don't auto-generate self-signed TLS certs
secret:
  enabled: false
  password: "admin123"
