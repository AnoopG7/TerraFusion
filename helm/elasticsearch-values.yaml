# Elasticsearch — Helm values (bitnami/elasticsearch)
# Install: helm repo add bitnami https://charts.bitnami.com/bitnami
# Install: helm upgrade --install elasticsearch bitnami/elasticsearch -n logging -f elasticsearch-values.yaml

global:
  kibanaEnabled: false

master:
  replicaCount: 1

data:
  replicaCount: 0

coordinating:
  replicaCount: 0

ingest:
  replicaCount: 0

secret:
  enabled: true

security:
  enabled: false

sysctlImage:
  enabled: false

image:
  tag: 8.5.1

resourcesPreset: none
