# Elasticsearch — Helm values
# Install: helm repo add elastic https://helm.elastic.co
# Install: helm upgrade --install elasticsearch elastic/elasticsearch -n logging --create-namespace -f elasticsearch-values.yaml

replicas: 1
minimumMasterNodes: 1

imageTag: "8.5.1"

# HTTP protocol since security is disabled (fixes readiness/liveness probe scheme)
protocol: http

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

esJavaOpts: "-Xmx512m -Xms512m"

networkPolicy:
  enabled: false

# Don't mount any TLS cert secrets (we disable security)
secretMounts: []

# Disable security for single-node demo
# NOTE: Do NOT set discovery.type: single-node here — it conflicts with
# the chart's auto-generated cluster.initial_master_nodes setting
esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false
