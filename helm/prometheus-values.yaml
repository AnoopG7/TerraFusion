# Prometheus + Grafana Stack — Helm values for kube-prometheus-stack
# Install: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# Install: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f prometheus-values.yaml

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: "2GB"
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    additionalScrapeConfigs:
    - job_name: 'terrafusion-backend'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: terrafusion
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: backend
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:3001
        target_label: __address__

grafana:
  adminPassword: "admin"
  defaultDashboardsEnabled: true
  service:
    type: NodePort
    nodePort: 30300
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-operated.monitoring.svc:9090
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: terrafusion
        orgId: 1
        folder: TerraFusion
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/terrafusion
  dashboards:
    terrafusion:
      climate-monitoring:
        json: |
          {
            "title": "TerraFusion — Climate Monitoring",
            "uid": "terrafusion-climate",
            "schemaVersion": 38,
            "version": 1,
            "panels": [
              {
                "title": "Sensor Readings (CO2)",
                "type": "graph",
                "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
                "targets": [{"expr": "avg(terrafusion_sensor_co2_ppm)", "legendFormat": "CO2 (PPM)"}]
              },
              {
                "title": "Sensor Readings (Temperature)",
                "type": "graph",
                "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
                "targets": [{"expr": "avg(terrafusion_sensor_temperature_c)", "legendFormat": "Temp (°C)"}]
              },
              {
                "title": "API Request Rate",
                "type": "graph",
                "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
                "targets": [{"expr": "rate(http_requests_total[5m])", "legendFormat": "req/s"}]
              },
              {
                "title": "API Error Rate",
                "type": "graph",
                "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
                "targets": [{"expr": "rate(http_requests_total{status=~\"5..\"}[5m])", "legendFormat": "errors/s"}]
              }
            ]
          }

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
    receivers:
    - name: 'null'

defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubernetesSystem: false
    kubeProxy: false
