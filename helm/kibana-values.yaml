# Kibana — Helm values
# Install: helm upgrade --install kibana elastic/kibana -n logging -f kibana-values.yaml

imageTag: "8.11.0"

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

service:
  type: NodePort
  nodePort: 30560

elasticsearchHosts: "https://elasticsearch-master.logging.svc:9200"

extraEnvs:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=1800"

kibanaConfig:
  kibana.yml: |
    elasticsearch.hosts: ["https://elasticsearch-master.logging.svc:9200"]
    server.host: "0.0.0.0"
    server.shutdownTimeout: "5s"
    monitoring.ui.container.elasticsearch.enabled: true
    elasticsearch.ssl.certificateAuthorities: /usr/share/kibana/config/certs/ca.crt
