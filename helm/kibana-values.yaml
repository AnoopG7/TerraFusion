# Kibana — Helm values
# Install: helm upgrade --install kibana elastic/kibana -n logging -f kibana-values.yaml

imageTag: "8.5.1"

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

service:
  type: NodePort
  nodePort: 30560

# ES security is disabled — use HTTP, not HTTPS
elasticsearchHosts: "http://elasticsearch-master.logging.svc:9200"

extraEnvs:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=1800"

kibanaConfig:
  kibana.yml: |
    elasticsearch.hosts: ["http://elasticsearch-master.logging.svc:9200"]
    server.host: "0.0.0.0"
    server.shutdownTimeout: "5s"
    monitoring.ui.container.elasticsearch.enabled: true
