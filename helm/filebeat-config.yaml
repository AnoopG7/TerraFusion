# Filebeat — DaemonSet Helm values
# Install: helm upgrade --install filebeat elastic/filebeat -n logging -f filebeat-config.yaml

imageTag: "8.11.0"

daemonSet:
  enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

filebeatConfig:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          templates:
            - condition:
                equals:
                  kubernetes.namespace: terrafusion
              config:
                - type: container
                  paths:
                    - "/var/log/containers/*${data.kubernetes.container.id}.log"

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
      - drop_fields:
          fields: ["host"]

    output.elasticsearch:
      hosts: '${ELASTICSEARCH_HOSTS:elasticsearch-master.logging.svc:9200}'

extraEnvs:
  - name: ELASTICSEARCH_HOSTS
    value: "elasticsearch-master.logging.svc:9200"
