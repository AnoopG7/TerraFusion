services:
  backend:
    build: ./backend
    container_name: terrafusion-api
    ports:
      - "8081:3001"
    environment:
      - PORT=3001
      - DB_TYPE=sqlite
      - JWT_SECRET=terrafusion-dev-secret-key-change-in-production
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: terrafusion-web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
